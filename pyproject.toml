[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc-gdr2ubl"
version = "4.0.2"
description = "Governed Data Records as conformant OASIS UBL 2.3 documents, through sdc-mapper: one mapping file per model, every value reported."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Axius SDC, Inc." }]
keywords = ["sdc", "semantic data charter", "governed data record", "ubl", "oasis", "invoice", "mapping"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "sdc-mapper>=4.3,<5",     # placements (4.1.0); '=name' joins (4.2.0); join_depth, LOOKUP_TRANSFORMS (4.3.0)
    "lxml>=5.0",
    "xmlschema>=3.0",         # the OASIS schemas: member order, required members, conformance
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.entry-points."sdc_mapper.targets"]
ubl = "sdc_gdr2ubl:UBLMapper"

[project.urls]
Repository = "https://github.com/SemanticDataCharter/sdc-gdr2ubl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdc_gdr2ubl = ["mappings/*.yaml", "xsd/common/*.xsd", "xsd/maindoc/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
